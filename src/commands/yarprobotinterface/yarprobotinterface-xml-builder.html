<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yarprobotinterface XML Builder</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f4;
  --surface: #ffffff;
  --surface-2: #edf4f1;
  --ink: #1d2524;
  --muted: #5d6a66;
  --line: #cfd8d3;
  --accent: #0b7a75;
  --accent-dark: #075c58;
  --warn: #a45b08;
  --danger: #9b2d20;
  --ok: #2c6e49;
  --shadow: 0 14px 32px rgba(34, 45, 42, 0.10);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); }
button, input, select, textarea { font: inherit; }
button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 2.35rem; padding: 0.45rem 0.75rem; border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: var(--accent-dark); }
button.danger { color: var(--danger); }
button:disabled, select:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }
input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); min-height: 2.35rem; padding: 0.45rem 0.55rem; }
textarea { min-height: 28rem; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.45; font-size: 0.88rem; }
label { display: grid; gap: 0.35rem; color: var(--muted); font-size: 0.85rem; }
label > span:first-child { font-weight: 650; color: var(--ink); }
.app { display: grid; grid-template-columns: minmax(320px, 0.9fr) minmax(420px, 1.1fr); min-height: 100vh; }
.left, .right { padding: 1rem; }
.left { border-right: 1px solid var(--line); overflow-y: auto; }
.right { display: grid; grid-template-rows: auto 1fr; gap: 1rem; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
h1 { margin: 0; font-size: 1.2rem; letter-spacing: 0; }
.meta { color: var(--muted); font-size: 0.82rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 1rem; }
.stack { display: grid; gap: 1rem; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; }
.row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.badge { display: inline-flex; align-items: center; min-height: 1.4rem; border: 1px solid var(--line); border-radius: 999px; padding: 0.12rem 0.45rem; color: var(--muted); font-size: 0.76rem; white-space: nowrap; }
.badge.required { color: #fff; background: var(--warn); border-color: var(--warn); }
.badge.optional { color: var(--accent-dark); background: var(--surface-2); border-color: #b8d8d2; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.8rem; }
.section-title h2 { font-size: 1rem; margin: 0; }
.device-summary { color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
.param-group { display: grid; gap: 0.7rem; }
.param-heading { margin-top: 0.25rem; padding-top: 0.7rem; border-top: 1px solid var(--line); font-weight: 700; color: var(--accent-dark); }
.param-row { display: grid; grid-template-columns: minmax(9rem, 0.8fr) minmax(10rem, 1fr); gap: 0.7rem; align-items: start; padding: 0.7rem; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfb; }
.param-row.optional-off { background: #f5f7f6; }
.param-name { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; min-width: 0; }
.param-name strong { overflow-wrap: anywhere; }
.param-doc { color: var(--muted); font-size: 0.78rem; line-height: 1.35; margin-top: 0.3rem; }
.checkline { display: flex; align-items: center; gap: 0.45rem; color: var(--muted); font-size: 0.8rem; }
.checkline input { width: auto; min-height: auto; }
.attach-list { display: grid; gap: 0.5rem; }
.attach-target { display: grid; grid-template-columns: minmax(7rem, 1fr) minmax(7rem, 1fr) auto; gap: 0.5rem; align-items: end; }
.manual-param-row { display: grid; grid-template-columns: minmax(6rem, 0.8fr) minmax(7rem, 1fr) minmax(8rem, 1.2fr) auto; gap: 0.5rem; align-items: end; }
.multi-select { min-height: 7.5rem; }
.external-list { display: grid; gap: 0.45rem; }
.external-item { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; border: 1px solid var(--line); border-radius: 8px; padding: 0.55rem 0.65rem; background: #fbfcfb; }
.external-item small { color: var(--muted); overflow-wrap: anywhere; }
.device-list { display: grid; gap: 0.5rem; }
.device-item { display: grid; grid-template-columns: 1fr auto; gap: 0.7rem; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 0.65rem; background: #fbfcfb; }
.device-item strong { display: block; overflow-wrap: anywhere; }
.device-item small { color: var(--muted); }
.preview-tools { display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; }
.status { min-height: 1.4rem; color: var(--muted); font-size: 0.84rem; }
.status.error { color: var(--danger); font-weight: 650; }
.status.ok { color: var(--ok); font-weight: 650; }
.hidden { display: none !important; }
@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .left { border-right: 0; border-bottom: 1px solid var(--line); }
  .right { min-height: 70vh; }
}
@media (max-width: 640px) {
  .grid-2, .grid-3, .param-row, .attach-target, .manual-param-row { grid-template-columns: 1fr; }
  .topbar, .section-title { align-items: flex-start; flex-direction: column; }
  .left, .right { padding: 0.75rem; }
}
</style>
</head>
<body>
<div class="app">
  <main class="left stack">
    <div class="topbar">
      <div>
        <h1>yarprobotinterface XML Builder</h1>
        <div class="meta" id="catalogMeta"></div>
      </div>
    </div>

    <section class="panel stack" aria-labelledby="robotSettingsTitle">
      <div class="section-title"><h2 id="robotSettingsTitle">Robot</h2></div>
      <div class="grid-3">
        <label><span>Robot name</span><input id="robotName" value="robotinterfaceExample" required></label>
        <label><span>Port prefix</span><input id="portPrefix" value="/robot"></label>
        <label><span>Build</span><input id="buildValue" value="0"></label>
      </div>
    </section>

    <section class="panel stack" aria-labelledby="externalPluginsTitle">
      <div class="section-title"><h2 id="externalPluginsTitle">External Plugins</h2><span class="badge" id="externalCountBadge">0 imported</span></div>
      <div class="row">
        <button id="chooseYarpDataDirButton">Choose YARP data dir</button>
        <button id="chooseManifestFilesButton">Choose manifest files</button>
      </div>
      <input id="yarpDataDirInput" class="hidden" type="file" webkitdirectory directory multiple>
      <input id="manifestFilesInput" class="hidden" type="file" accept=".ini" multiple>
      <div id="externalStatus" class="status" role="status"></div>
      <div id="externalList" class="external-list"></div>
    </section>

    <section class="panel stack" aria-labelledby="deviceBuilderTitle">
      <div class="section-title"><h2 id="deviceBuilderTitle">Device</h2><span class="badge" id="deviceCountBadge"></span></div>
      <label><span>Abstract interface</span><select id="interfaceSelect"></select></label>
      <label><span>Device type</span><select id="deviceSelect" disabled></select></label>
      <div id="deviceSummary" class="device-summary"></div>
      <label><span>XML instance name</span><input id="instanceName" placeholder="example_device" required></label>
      <div id="paramsHost" class="param-group"></div>
      <div id="attachHost" class="stack hidden"></div>
      <div class="row">
        <button id="addDeviceButton" class="primary" disabled>Add device</button>
        <button id="resetFormButton">Reset form</button>
      </div>
      <div id="formStatus" class="status" role="status"></div>
    </section>

    <section class="panel stack" aria-labelledby="addedDevicesTitle">
      <div class="section-title"><h2 id="addedDevicesTitle">Added Devices</h2><button id="clearButton" class="danger">Clear</button></div>
      <div id="deviceList" class="device-list"></div>
    </section>
  </main>

  <aside class="right">
    <section class="panel">
      <div class="section-title">
        <h2>XML</h2>
        <div class="preview-tools">
          <button id="copyButton">Copy</button>
          <button id="downloadButton">Download</button>
        </div>
      </div>
      <div id="previewStatus" class="status"></div>
    </section>
    <textarea id="xmlPreview" spellcheck="false" aria-label="Generated XML"></textarea>
  </aside>
</div>

<script>
(() => {
  "use strict";

  const catalog = JSON.parse(document.getElementById("catalog-data").textContent);
  const byId = (id) => document.getElementById(id);
  const ifaceNames = catalog.interfaces;
  const devices = catalog.devices.map((device) => ({
    ...device,
    interfaces: device.i.map((index) => ifaceNames[index]),
    attachInterfaces: device.q.map((index) => ifaceNames[index])
  }));
  const deviceByName = new Map(devices.map((device) => [device.n, device]));
  const PSEUDO_EXTERNAL_INTERFACE = "__external__";
  const WRAPPER_ALIASES = {
    AudioRecorderWrapper: "audioRecorder_nws_yarp",
    batteryWrapper: "battery_nws_yarp",
    analogServer: "multipleanalogsensorsserver",
    controlboard: "controlBoard_nws_yarp",
    controlboard_nws_yarp: "controlBoard_nws_yarp",
    grabber: "audioRecorder_nws_yarp",
    inertial: "multipleanalogsensorsserver",
    JoypadControlServer: "JoypadControl_nws_yarp",
    rgbdSensor_nws_yarp: "RGBDSensor_nws_yarp",
    serial: "serialPort_nws_yarp"
  };

  const state = {
    items: [],
    attachTargets: [],
    externalImports: devices.filter((device) => device.external)
  };

  const els = {
    catalogMeta: byId("catalogMeta"),
    deviceCountBadge: byId("deviceCountBadge"),
    robotName: byId("robotName"),
    portPrefix: byId("portPrefix"),
    buildValue: byId("buildValue"),
    interfaceSelect: byId("interfaceSelect"),
    deviceSelect: byId("deviceSelect"),
    deviceSummary: byId("deviceSummary"),
    instanceName: byId("instanceName"),
    paramsHost: byId("paramsHost"),
    attachHost: byId("attachHost"),
    addDeviceButton: byId("addDeviceButton"),
    resetFormButton: byId("resetFormButton"),
    formStatus: byId("formStatus"),
    externalCountBadge: byId("externalCountBadge"),
    chooseYarpDataDirButton: byId("chooseYarpDataDirButton"),
    chooseManifestFilesButton: byId("chooseManifestFilesButton"),
    yarpDataDirInput: byId("yarpDataDirInput"),
    manifestFilesInput: byId("manifestFilesInput"),
    externalStatus: byId("externalStatus"),
    externalList: byId("externalList"),
    deviceList: byId("deviceList"),
    clearButton: byId("clearButton"),
    copyButton: byId("copyButton"),
    downloadButton: byId("downloadButton"),
    xmlPreview: byId("xmlPreview"),
    previewStatus: byId("previewStatus")
  };

  function escapeXml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&apos;");
  }

  function setStatus(text, type = "") {
    els.formStatus.textContent = text;
    els.formStatus.className = `status ${type}`.trim();
  }

  function option(value, label) {
    const opt = document.createElement("option");
    opt.value = value;
    opt.textContent = label;
    return opt;
  }

  function wrapperCanonical(name) {
    const raw = name || "";
    if (deviceByName.has(raw)) return raw;
    if (WRAPPER_ALIASES[raw]) return WRAPPER_ALIASES[raw];
    const lower = raw.toLowerCase();
    const match = devices.find((device) => device.n.toLowerCase() === lower);
    return match ? match.n : raw;
  }

  function selectedValues(select) {
    return [...select.selectedOptions].map((opt) => opt.value).filter(Boolean);
  }

  function setExternalStatus(text, type = "") {
    els.externalStatus.textContent = text;
    els.externalStatus.className = `status ${type}`.trim();
  }

  function refreshCatalogMeta() {
    const externalCount = state.externalImports.length;
    const externalText = externalCount ? `, ${externalCount} external imported` : "";
    const builtInCount = devices.filter((device) => !device.external).length;
    els.catalogMeta.textContent = `${builtInCount} built-in devices${externalText}, ${ifaceNames.length} interfaces, generated ${catalog.generated}`;
  }

  function stripQuotes(value) {
    const trimmed = String(value ?? "").trim();
    const quoted = trimmed.match(/^(['"])(.*)\1$/);
    return quoted ? quoted[2] : trimmed;
  }

  function uniqueValues(values) {
    return [...new Set(values.filter(Boolean))];
  }

  function parseInterfaceList(value) {
    return uniqueValues(
      stripQuotes(value)
        .replace(/[()]/g, " ")
        .split(/[,\s;]+/)
        .map((name) => name.trim())
        .filter((name) => ifaceNames.includes(name))
    );
  }

  function normalizePath(path) {
    return String(path || "").replaceAll("\\", "/");
  }

  function isPluginManifestPath(path) {
    const normalized = normalizePath(path).toLowerCase();
    return normalized.endsWith(".ini") && normalized.split("/").includes("plugins");
  }

  function parsePluginManifest(text, sourcePath = "") {
    let sectionName = "";
    const fields = {};
    for (const rawLine of text.split(/\r?\n/)) {
      let line = rawLine.trim();
      if (!line || line.startsWith("#") || line.startsWith(";")) continue;
      line = line.replace(/\s+[;#].*$/, "").trim();
      const section = line.match(/^\[plugin\s+([^\]]+)\]$/i);
      if (section) {
        sectionName = stripQuotes(section[1]);
        continue;
      }
      const pair = line.match(/^([^\s=]+)(?:\s*=\s*|\s+)(.*)$/);
      if (!pair) continue;
      fields[pair[1].toLowerCase()] = stripQuotes(pair[2]);
    }
    if ((fields.type || "").toLowerCase() !== "device") return null;
    const name = fields.name || sectionName;
    if (!name) return null;
    return {
      name,
      library: fields.library || "",
      wrapper: fields.wrapper || "",
      sourcePath: normalizePath(sourcePath),
      fields
    };
  }

  function externalDeviceFromManifest(manifest) {
    const wrapperName = wrapperCanonical(manifest.wrapper);
    const wrapperDevice = deviceByName.get(wrapperName);
    const manifestInterfaces = parseInterfaceList(manifest.fields.interfaces || manifest.fields.interface || "");
    const inferredInterfaces = wrapperDevice ? wrapperDevice.attachInterfaces : [];
    const attachInterfaces = parseInterfaceList(
      manifest.fields.attach_interfaces ||
      manifest.fields.attachinterfaces ||
      manifest.fields.viewed_interfaces ||
      manifest.fields.viewedinterfaces ||
      ""
    );
    const isSelfWrapper = Boolean(manifest.wrapper) && wrapperCanonical(manifest.wrapper) === manifest.name;
    const canAttach = isSelfWrapper || attachInterfaces.length > 0;
    const interfaces = uniqueValues([
      ...manifestInterfaces,
      ...inferredInterfaces,
      ...(canAttach ? ["IWrapper", "IMultipleWrapper"] : [])
    ]);
    return {
      n: manifest.name,
      c: manifest.library || "external plugin",
      p: manifest.sourcePath || "external manifest",
      w: manifest.wrapper || "",
      i: [],
      q: [],
      x: [],
      s: canAttach ? 1 : 0,
      m: canAttach ? 1 : 0,
      a: canAttach ? 1 : 0,
      r: [],
      interfaces,
      attachInterfaces,
      external: true,
      customParams: [],
      manifest
    };
  }

  async function readManifestFiles(files, onlyPluginFolder) {
    const manifests = [];
    let scanned = 0;
    let rejected = 0;
    for (const file of files) {
      const sourcePath = normalizePath(file.webkitRelativePath || file.name);
      if (!sourcePath.toLowerCase().endsWith(".ini")) continue;
      if (onlyPluginFolder && !isPluginManifestPath(sourcePath)) continue;
      scanned += 1;
      try {
        const manifest = parsePluginManifest(await file.text(), sourcePath);
        if (manifest) {
          manifests.push(manifest);
        } else {
          rejected += 1;
        }
      } catch {
        rejected += 1;
      }
    }
    return { manifests, scanned, rejected };
  }

  async function readManifestDirectory(directoryHandle, prefix = "") {
    const manifests = [];
    let scanned = 0;
    let rejected = 0;
    for await (const [name, handle] of directoryHandle.entries()) {
      const path = prefix ? `${prefix}/${name}` : name;
      if (handle.kind === "directory") {
        const nested = await readManifestDirectory(handle, path);
        manifests.push(...nested.manifests);
        scanned += nested.scanned;
        rejected += nested.rejected;
      } else if (handle.kind === "file" && isPluginManifestPath(path)) {
        scanned += 1;
        try {
          const file = await handle.getFile();
          const manifest = parsePluginManifest(await file.text(), path);
          if (manifest) {
            manifests.push(manifest);
          } else {
            rejected += 1;
          }
        } catch {
          rejected += 1;
        }
      }
    }
    return { manifests, scanned, rejected };
  }

  function syncExternalWrapperLinks() {
    for (const device of devices.filter((entry) => entry.external)) {
      const wrapperName = wrapperCanonical(device.w);
      if (!wrapperName || wrapperName === device.n) continue;
      const wrapper = deviceByName.get(wrapperName);
      if (wrapper?.a && !wrapper.x.includes(device.n)) wrapper.x.push(device.n);
    }
    for (const wrapper of devices.filter((entry) => entry.external && entry.a)) {
      for (const device of devices.filter((entry) => entry.external && entry.n !== wrapper.n)) {
        if (wrapperCanonical(device.w) === wrapper.n && !wrapper.x.includes(device.n)) wrapper.x.push(device.n);
      }
    }
  }

  function renderExternalImports() {
    const imported = [...state.externalImports].sort((a, b) => a.n.localeCompare(b.n));
    els.externalCountBadge.textContent = `${imported.length} imported`;
    els.externalList.replaceChildren();
    for (const device of imported) {
      const row = document.createElement("div");
      row.className = "external-item";
      const text = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = device.n;
      const details = document.createElement("small");
      const ifaces = device.interfaces.length ? device.interfaces.join(", ") : "interfaces not tagged";
      details.textContent = [device.w ? `wrapper: ${device.w}` : "", ifaces, device.p].filter(Boolean).join(" | ");
      text.append(title, details);
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = device.a ? "attach" : "device";
      row.append(text, badge);
      els.externalList.appendChild(row);
    }
  }

  function importManifests(manifests) {
    let added = 0;
    let duplicates = 0;
    for (const manifest of manifests) {
      if (deviceByName.has(manifest.name)) {
        duplicates += 1;
        continue;
      }
      const device = externalDeviceFromManifest(manifest);
      devices.push(device);
      deviceByName.set(device.n, device);
      state.externalImports.push(device);
      added += 1;
    }
    if (!added) {
      renderExternalImports();
      return { added, duplicates };
    }
    syncExternalWrapperLinks();
    refreshCatalogMeta();
    const previousDevice = els.deviceSelect.value;
    fillInterfaceSelect();
    refreshDeviceSelect();
    if (previousDevice && [...els.deviceSelect.options].some((opt) => opt.value === previousDevice)) {
      els.deviceSelect.value = previousDevice;
      renderSelectedDevice();
    }
    renderExternalImports();
    return { added, duplicates };
  }

  function manifestStatus(result, stats) {
    const pieces = [`${stats.added} imported`];
    if (stats.duplicates) pieces.push(`${stats.duplicates} skipped as already known`);
    if (result.rejected) pieces.push(`${result.rejected} ignored`);
    pieces.push(`${result.scanned} manifest${result.scanned === 1 ? "" : "s"} scanned`);
    return pieces.join(", ");
  }

  async function importFromFileList(files, onlyPluginFolder) {
    const selected = [...files];
    if (!selected.length) return;
    setExternalStatus("Reading manifests...");
    const result = await readManifestFiles(selected, onlyPluginFolder);
    const stats = importManifests(result.manifests);
    setExternalStatus(manifestStatus(result, stats), stats.added ? "ok" : "");
  }

  async function chooseYarpDataDir() {
    if (window.showDirectoryPicker) {
      try {
        const handle = await window.showDirectoryPicker();
        setExternalStatus("Reading manifests...");
        const result = await readManifestDirectory(handle);
        const stats = importManifests(result.manifests);
        setExternalStatus(manifestStatus(result, stats), stats.added ? "ok" : "");
        return;
      } catch (err) {
        if (err.name === "AbortError") return;
      }
    }
    els.yarpDataDirInput.click();
  }

  function selectedDevice() {
    return deviceByName.get(els.deviceSelect.value) || null;
  }

  function deviceLabel(device) {
    const nw = /_nwc_|nwc/i.test(device.n) ? " [nwc]" : /_nws_|nws/i.test(device.n) ? " [nws]" : "";
    const external = device.external ? " [external]" : "";
    return `${device.n}${nw}${external} (${device.c || "class unknown"})`;
  }

  function fillInterfaceSelect() {
    const previous = els.interfaceSelect.value;
    const counts = new Map(ifaceNames.map((name) => [name, 0]));
    for (const device of devices) {
      for (const iface of device.interfaces) counts.set(iface, (counts.get(iface) || 0) + 1);
    }
    els.interfaceSelect.replaceChildren(option("", "Select an interface"));
    for (const name of ifaceNames) {
      els.interfaceSelect.appendChild(option(name, `${name} (${counts.get(name) || 0})`));
    }
    const importedCount = devices.filter((device) => device.external).length;
    if (importedCount) {
      els.interfaceSelect.appendChild(option(PSEUDO_EXTERNAL_INTERFACE, `External imports (${importedCount})`));
    }
    if ([...els.interfaceSelect.options].some((opt) => opt.value === previous)) {
      els.interfaceSelect.value = previous;
    }
  }

  function refreshDeviceSelect() {
    const iface = els.interfaceSelect.value;
    els.deviceSelect.disabled = !iface;
    els.deviceSelect.replaceChildren(option("", iface ? "Select a device" : "Select an interface first"));
    if (!iface) {
      renderSelectedDevice();
      return;
    }
    const matching = devices
      .filter((device) => iface === PSEUDO_EXTERNAL_INTERFACE ? device.external : device.interfaces.includes(iface))
      .sort((a, b) => a.n.localeCompare(b.n));
    for (const device of matching) els.deviceSelect.appendChild(option(device.n, deviceLabel(device)));
    els.deviceCountBadge.textContent = `${matching.length} device types`;
    renderSelectedDevice();
  }

  function suggestInstanceName(device) {
    const base = (device?.n || "device").replace(/[^A-Za-z0-9_]/g, "_");
    let index = state.items.length + 1;
    let candidate = `${base}_${index}`;
    const used = new Set(state.items.map((item) => item.name));
    while (used.has(candidate)) {
      index += 1;
      candidate = `${base}_${index}`;
    }
    return candidate;
  }

  function renderSelectedDevice() {
    const device = selectedDevice();
    els.paramsHost.replaceChildren();
    els.attachHost.replaceChildren();
    els.attachHost.classList.add("hidden");
    els.addDeviceButton.disabled = !device;
    state.attachTargets = [];
    if (!device) {
      els.deviceSummary.textContent = "";
      els.instanceName.value = "";
      return;
    }
    els.instanceName.value = suggestInstanceName(device);
    renderDeviceSummary(device);
    if (device.external) renderExternalMetadataEditor(device);
    renderParams(device);
    renderAttach(device);
    setStatus("");
  }

  function renderDeviceSummary(device) {
    const paramCount = device.r.length;
    const required = device.r.filter((row) => row[5]).length;
    const paramText = device.external
      ? "generated parameters unavailable"
      : `${paramCount} generated parameters (${required} mandatory)`;
    const attachText = device.a
      ? `Attach: ${device.s ? "single" : ""}${device.s && device.m ? ", " : ""}${device.m ? "multiple" : ""}`
      : "No robotinterface attach method found";
    els.deviceSummary.textContent = `${device.p} | ${device.interfaces.length} interfaces | ${paramText} | ${attachText}`;
  }

  function interfaceMultiSelect(selected) {
    const select = document.createElement("select");
    select.multiple = true;
    select.className = "multi-select";
    const chosen = new Set(selected || []);
    for (const iface of ifaceNames) {
      const opt = option(iface, iface);
      opt.selected = chosen.has(iface);
      select.appendChild(opt);
    }
    return select;
  }

  function renderExternalMetadataEditor(device) {
    const heading = document.createElement("div");
    heading.className = "param-heading";
    heading.textContent = "External metadata";

    const grid = document.createElement("div");
    grid.className = "grid-2";
    const ifaceLabel = document.createElement("label");
    const ifaceSpan = document.createElement("span");
    ifaceSpan.textContent = "Implemented interfaces";
    const ifaceSelect = interfaceMultiSelect(device.interfaces);
    ifaceLabel.append(ifaceSpan, ifaceSelect);

    const attachIfaceLabel = document.createElement("label");
    const attachIfaceSpan = document.createElement("span");
    attachIfaceSpan.textContent = "Attach target interfaces";
    const attachIfaceSelect = interfaceMultiSelect(device.attachInterfaces);
    attachIfaceLabel.append(attachIfaceSpan, attachIfaceSelect);
    grid.append(ifaceLabel, attachIfaceLabel);

    const flags = document.createElement("div");
    flags.className = "row";
    const attachLabel = document.createElement("label");
    attachLabel.className = "checkline";
    const attach = document.createElement("input");
    attach.type = "checkbox";
    attach.checked = Boolean(device.a);
    const attachText = document.createElement("span");
    attachText.textContent = "has Attach method";
    attachLabel.append(attach, attachText);

    const multipleLabel = document.createElement("label");
    multipleLabel.className = "checkline";
    const multiple = document.createElement("input");
    multiple.type = "checkbox";
    multiple.checked = Boolean(device.m);
    const multipleText = document.createElement("span");
    multipleText.textContent = "multiple attach";
    multipleLabel.append(multiple, multipleText);
    flags.append(attachLabel, multipleLabel);

    function syncMetadata(rerenderAttach = true) {
      device.interfaces = selectedValues(ifaceSelect);
      device.attachInterfaces = selectedValues(attachIfaceSelect);
      device.a = attach.checked ? 1 : 0;
      device.s = attach.checked ? 1 : 0;
      device.m = attach.checked && multiple.checked ? 1 : 0;
      if (device.a && !device.interfaces.includes("IWrapper")) device.interfaces.push("IWrapper");
      if (device.m && !device.interfaces.includes("IMultipleWrapper")) device.interfaces.push("IMultipleWrapper");
      for (const opt of ifaceSelect.options) opt.selected = device.interfaces.includes(opt.value);
      multiple.disabled = !device.a;
      attachIfaceSelect.disabled = !device.a;
      syncExternalWrapperLinks();
      renderDeviceSummary(device);
      fillInterfaceSelect();
      renderExternalImports();
      if (!rerenderAttach) return;
      const currentName = els.instanceName.value;
      els.attachHost.replaceChildren();
      els.attachHost.classList.add("hidden");
      state.attachTargets = [];
      renderAttach(device);
      els.instanceName.value = currentName;
    }

    ifaceSelect.addEventListener("change", syncMetadata);
    attachIfaceSelect.addEventListener("change", syncMetadata);
    attach.addEventListener("change", syncMetadata);
    multiple.addEventListener("change", syncMetadata);
    syncMetadata(false);
    els.paramsHost.append(heading, grid, flags);
  }

  function renderCustomParamEditor(device) {
    if (!device.customParams) device.customParams = [];
    if (device.external && !device.customParams.length) {
      device.customParams.push({ group: "", name: "", value: "" });
    }

    const heading = document.createElement("div");
    heading.className = "param-heading";
    heading.textContent = "Manual XML parameters";
    const list = document.createElement("div");
    list.className = "stack";
    const add = document.createElement("button");
    add.type = "button";
    add.textContent = "Add parameter";

    function renderRows() {
      list.replaceChildren();
      for (const [index, param] of device.customParams.entries()) {
        const row = document.createElement("div");

        const groupLabel = document.createElement("label");
        const groupSpan = document.createElement("span");
        groupSpan.textContent = "Group";
        const groupInput = document.createElement("input");
        groupInput.dataset.manualGroup = "1";
        groupInput.value = param.group || "";
        groupInput.placeholder = "optional";
        groupInput.addEventListener("input", () => { param.group = groupInput.value; });
        groupLabel.append(groupSpan, groupInput);

        const nameLabel = document.createElement("label");
        const nameSpan = document.createElement("span");
        nameSpan.textContent = "Name";
        const nameInput = document.createElement("input");
        nameInput.dataset.manualName = "1";
        nameInput.value = param.name || "";
        nameInput.placeholder = "param_name";
        nameInput.addEventListener("input", () => { param.name = nameInput.value; });
        nameLabel.append(nameSpan, nameInput);

        const valueLabel = document.createElement("label");
        const valueSpan = document.createElement("span");
        valueSpan.textContent = "Value";
        const valueInput = document.createElement("input");
        valueInput.dataset.manualValue = "1";
        valueInput.value = param.value || "";
        valueInput.placeholder = "value";
        valueInput.addEventListener("input", () => { param.value = valueInput.value; });

        const remove = document.createElement("button");

        remove.className = "danger";

        remove.addEventListener("click", () => {
          device.customParams.splice(index, 1);
          renderRows();

        row.append(groupLabel, nameLabel, valueLabel, remove);
        list.appendChild(row);
      }
    }

    add.addEventListener("click", () => {
      device.customParams.push({ group: "", name: "", value: "" });

  function inputForParam(row, includeInput) {
    const type = row[2].toLowerCase();
    let input;
    if (type === "bool") {
      input = document.createElement("select");
      input.appendChild(option("true", "true"));
      input.appendChild(option("false", "false"));
      input.value = row[4] === "true" ? "true" : "false";
    } else {
      input = document.createElement("input");
      input.type = "text";
      input.value = row[4] || "";
      input.placeholder = row[5] ? "mandatory_value" : "optional_value";
    }
    input.dataset.paramInput = "1";
    input.disabled = includeInput ? !includeInput.checked : false;
    return input;
  }

  function renderParams(device) {
    if (!device.r.length) {
      const empty = document.createElement("div");
      empty.className = "device-summary";
      empty.textContent = "No generated parameter table was found for this device.";
      els.paramsHost.appendChild(empty);
    } else {
      let lastGroup = null;
      for (const row of device.r) {
        const group = row[0] || "Ungrouped";
        if (group !== lastGroup) {
          const heading = document.createElement("div");
          heading.className = "param-heading";
          heading.textContent = group;
          els.paramsHost.appendChild(heading);
          lastGroup = group;
        }
        const required = Boolean(row[5]);
        const wrap = document.createElement("div");
        wrap.className = `param-row ${required ? "" : "optional-off"}`.trim();
        wrap.dataset.paramName = row[1];
        wrap.dataset.paramGroup = row[0];
        const left = document.createElement("div");
        const name = document.createElement("div");
        name.className = "param-name";
        const strong = document.createElement("strong");
        strong.textContent = row[1];
        const badge = document.createElement("span");
        badge.className = `badge ${required ? "required" : "optional"}`;
        badge.textContent = required ? "mandatory" : "optional";
        name.append(strong, badge);
        const doc = document.createElement("div");
        doc.className = "param-doc";
        doc.textContent = [row[2], row[3] ? `units: ${row[3]}` : "", row[6], row[7]].filter(Boolean).join(" | ");
        left.append(name, doc);
        const right = document.createElement("div");
        let includeInput = null;
        if (!required) {
          const check = document.createElement("label");
          check.className = "checkline";
          includeInput = document.createElement("input");
          includeInput.type = "checkbox";
          includeInput.dataset.includeParam = "1";
          const text = document.createElement("span");
          text.textContent = "include";
          check.append(includeInput, text);
          right.appendChild(check);
        }
        const input = inputForParam(row, includeInput);
        if (required) input.required = true;
        if (includeInput) {
          includeInput.addEventListener("change", () => {
            input.disabled = !includeInput.checked;
            wrap.classList.toggle("optional-off", !includeInput.checked);
          });
        }
        right.appendChild(input);
        wrap.append(left, right);
        els.paramsHost.appendChild(wrap);
      }
    }
    if (device.external || device.customParams?.length) renderCustomParamEditor(device);
  }

  function rankedCompatibleInstances(device) {
    const explicit = new Set(device.x || []);
    const attachIfaces = new Set(device.attachInterfaces || []);
    return state.items
      .map((item) => {
        const target = deviceByName.get(item.type);
        const explicitScore = explicit.has(item.type) ? 2 : 0;
        const shared = target ? target.interfaces.filter((name) => attachIfaces.has(name)) : [];
        const score = explicitScore || (shared.length ? 1 : 0);
        return { item, target, score, shared };
      })
      .filter((entry) => entry.score > 0)
      .sort((a, b) => b.score - a.score || a.item.name.localeCompare(b.item.name));
  }

  function renderAttach(device) {
    if (!device.a) return;
    els.attachHost.classList.remove("hidden");
    const title = document.createElement("div");
    title.className = "section-title";
    const h = document.createElement("h2");
    h.textContent = "Attach";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = device.m ? "single or multiple" : "single";
    title.append(h, badge);

    const enableLine = document.createElement("label");
    enableLine.className = "checkline";
    const enable = document.createElement("input");
    enable.type = "checkbox";
    enable.id = "attachEnabled";
    const enableText = document.createElement("span");
    enableText.textContent = "generate startup attach and shutdown detach actions";
    enableLine.append(enable, enableText);

    const controls = document.createElement("div");
    controls.className = "stack hidden";
    controls.id = "attachControls";

    const candidates = rankedCompatibleInstances(device);
    const info = document.createElement("div");
    info.className = "device-summary";
    const viewed = device.attachInterfaces.length ? `Viewed interfaces: ${device.attachInterfaces.join(", ")}` : "Viewed interfaces: not detected";
    const compatibleTypes = device.x.length ? `Wrapper hints: ${device.x.slice(0, 10).join(", ")}${device.x.length > 10 ? " ..." : ""}` : "Wrapper hints: none";
    info.textContent = `${viewed} | ${compatibleTypes}`;

    const modeRow = document.createElement("div");
    modeRow.className = "grid-2";
    const modeLabel = document.createElement("label");
    const modeSpan = document.createElement("span");
    modeSpan.textContent = "Attach mode";
    const mode = document.createElement("select");
    mode.id = "attachMode";
    mode.appendChild(option("single", "single target"));
    if (device.m) mode.appendChild(option("multiple", "multiple targets"));
    modeLabel.append(modeSpan, mode);
    modeRow.appendChild(modeLabel);

    const singleLabel = document.createElement("label");
    const singleSpan = document.createElement("span");
    singleSpan.textContent = "Target instance";
    const singleSelect = document.createElement("select");
    singleSelect.id = "singleAttachTarget";
    singleLabel.append(singleSpan, singleSelect);
    modeRow.appendChild(singleLabel);

    const multiBox = document.createElement("div");
    multiBox.className = "stack hidden";
    multiBox.id = "multiAttachBox";
    const addRow = document.createElement("div");
    addRow.className = "attach-target";
    const multiTargetLabel = document.createElement("label");
    const multiTargetSpan = document.createElement("span");
    multiTargetSpan.textContent = "Target instance";
    const multiTargetSelect = document.createElement("select");
    multiTargetSelect.id = "multiAttachTarget";
    multiTargetLabel.append(multiTargetSpan, multiTargetSelect);
    const keyLabel = document.createElement("label");
    const keySpan = document.createElement("span");
    keySpan.textContent = "Network key";
    const keyInput = document.createElement("input");
    keyInput.id = "multiAttachKey";
    keyInput.placeholder = "attached_device";
    keyLabel.append(keySpan, keyInput);
    const addTarget = document.createElement("button");
    addTarget.type = "button";
    addTarget.textContent = "Add target";
    addRow.append(multiTargetLabel, keyLabel, addTarget);
    const chosen = document.createElement("div");
    chosen.className = "attach-list";
    chosen.id = "multiAttachList";
    multiBox.append(addRow, chosen);

    const noTargets = document.createElement("div");
    noTargets.className = "status";
    noTargets.textContent = candidates.length ? "" : "Add a compatible device instance before adding this attach action.";

    function fillTargetSelect(select) {
      select.replaceChildren(option("", candidates.length ? "Select target" : "No compatible instances yet"));
      for (const entry of candidates) {
        const suffix = entry.score === 2 ? "wrapper hint" : entry.shared.join(", ");
        select.appendChild(option(entry.item.name, `${entry.item.name} (${entry.item.type}; ${suffix})`));
      }
    }

    function renderMultiList() {
      chosen.replaceChildren();
      for (const [index, target] of state.attachTargets.entries()) {
        const row = document.createElement("div");
        row.className = "attach-target";
        const key = document.createElement("input");
        key.value = target.key;
        key.addEventListener("input", () => { target.key = key.value; refreshPreview(); });
        const name = document.createElement("input");
        name.value = target.device;
        name.disabled = true;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          state.attachTargets.splice(index, 1);
          renderMultiList();
          refreshPreview();
        });
        row.append(key, name, remove);
        chosen.appendChild(row);
      }
    }

    function syncMode() {
      const isMultiple = mode.value === "multiple";
      singleLabel.classList.toggle("hidden", isMultiple);
      multiBox.classList.toggle("hidden", !isMultiple);
      refreshPreview();
    }

    fillTargetSelect(singleSelect);
    fillTargetSelect(multiTargetSelect);
    multiTargetSelect.addEventListener("change", () => {
      keyInput.value = multiTargetSelect.value || "";
    });
    addTarget.addEventListener("click", () => {
      const value = multiTargetSelect.value;
      if (!value) return;
      if (!state.attachTargets.some((target) => target.device === value)) {
        state.attachTargets.push({ device: value, key: keyInput.value || value });
        renderMultiList();
      }
      refreshPreview();
    });
    enable.addEventListener("change", () => {
      controls.classList.toggle("hidden", !enable.checked);
      refreshPreview();
    });
    mode.addEventListener("change", syncMode);
    singleSelect.addEventListener("change", refreshPreview);
    controls.append(info, modeRow, multiBox, noTargets);
    els.attachHost.append(title, enableLine, controls);
    syncMode();
  }

  function collectParams() {
    const params = [];
    const rows = els.paramsHost.querySelectorAll(".param-row");
    for (const row of rows) {
      const include = row.querySelector("[data-include-param]");
      const input = row.querySelector("[data-param-input]");
      const required = !include;
      if (!input) continue;
      if (!required && !include.checked) continue;
      const value = input.value.trim();
      if (required && !value) {
        input.focus();
        throw new Error(`Missing mandatory parameter: ${row.dataset.paramName}`);
      }
      params.push({ group: row.dataset.paramGroup || "", name: row.dataset.paramName, value });
    }
    const manualRows = els.paramsHost.querySelectorAll("[data-manual-param]");
    for (const row of manualRows) {
      const group = row.querySelector("[data-manual-group]")?.value.trim() || "";
      const nameInput = row.querySelector("[data-manual-name]");
      const name = nameInput?.value.trim() || "";
      const value = row.querySelector("[data-manual-value]")?.value.trim() || "";
      if (!group && !name && !value) continue;
      if (!name) {
        nameInput?.focus();
        throw new Error("Manual parameter name is mandatory.");
      }
      params.push({ group, name, value });
    }
    return params;
  }

  function collectAttach() {
    const enabled = byId("attachEnabled");
    if (!enabled || !enabled.checked) return null;
    const mode = byId("attachMode")?.value || "single";
    if (mode === "multiple") {
      if (!state.attachTargets.length) throw new Error("Add at least one attach target.");
      return { mode, targets: state.attachTargets.map((target) => ({ ...target })) };
    }
    const target = byId("singleAttachTarget")?.value || "";
    if (!target) throw new Error("Select an attach target.");
    return { mode: "single", target };
  }

  function addDevice() {
    const device = selectedDevice();
    if (!device) return;
    const name = els.instanceName.value.trim();
    if (!name) {
      els.instanceName.focus();
      setStatus("XML instance name is mandatory.", "error");
      return;
    }
    if (state.items.some((item) => item.name === name)) {
      els.instanceName.focus();
      setStatus("XML instance names must be unique.", "error");
      return;
    }
    try {
      const params = collectParams();
      const attach = collectAttach();
      state.items.push({ name, type: device.n, className: device.c, params, attach });
      renderDeviceList();
      refreshPreview();
      setStatus(`Added ${name}.`, "ok");
      renderSelectedDevice();
    } catch (err) {
      setStatus(err.message, "error");
    }
  }

  function renderDeviceList() {
    els.deviceList.replaceChildren();
    if (!state.items.length) {
      const empty = document.createElement("div");
      empty.className = "device-summary";
      empty.textContent = "No devices added yet.";
      els.deviceList.appendChild(empty);
      return;
    }
    state.items.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "device-item";
      const text = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = item.name;
      const sub = document.createElement("small");
      sub.textContent = `${item.type}${item.attach ? " | attach" : ""}`;
      text.append(title, sub);
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "danger";
      remove.textContent = "Remove";
      remove.addEventListener("click", () => {
        state.items.splice(index, 1);
        renderDeviceList();
        renderSelectedDevice();
        refreshPreview();
      });
      row.append(text, remove);
      els.deviceList.appendChild(row);
    });
  }

  function segmentFor(item, indent = "    ") {
    const lines = [];
    lines.push(`${indent}<device name="${escapeXml(item.name)}" type="${escapeXml(item.type)}">`);
    const plain = item.params.filter((param) => !param.group);
    const grouped = item.params.filter((param) => param.group);
    for (const param of plain) {
      lines.push(`${indent}  <param name="${escapeXml(param.name)}"> ${escapeXml(param.value)} </param>`);
    }
    const groups = [];
    for (const param of grouped) {
      let group = groups.find((entry) => entry.name === param.group);
      if (!group) {
        group = { name: param.group, params: [] };
        groups.push(group);
      }
      group.params.push(param);
    }
    for (const group of groups) {
      lines.push(`${indent}  <group name="${escapeXml(group.name)}">`);
      for (const param of group.params) {
        lines.push(`${indent}    <param name="${escapeXml(param.name)}"> ${escapeXml(param.value)} </param>`);
      }
      lines.push(`${indent}  </group>`);
    }
    if (item.attach) {
      lines.push(`${indent}  <action phase="startup" level="5" type="attach">`);
      if (item.attach.mode === "multiple") {
        lines.push(`${indent}    <paramlist name="networks">`);
        for (const target of item.attach.targets) {
          lines.push(`${indent}      <elem name="${escapeXml(target.key)}"> ${escapeXml(target.device)} </elem>`);
        }
        lines.push(`${indent}    </paramlist>`);
      } else {
        lines.push(`${indent}    <param name="device"> ${escapeXml(item.attach.target)} </param>`);
      }
      lines.push(`${indent}  </action>`);
      lines.push(`${indent}  <action phase="shutdown" level="5" type="detach" />`);
    }
    lines.push(`${indent}</device>`);
    return lines.join("\n");
  }

  function buildXml() {
    const robotName = els.robotName.value.trim() || "robotinterfaceExample";
    const portPrefix = els.portPrefix.value.trim();
    const build = els.buildValue.value.trim() || "0";
    const attrs = [`name="${escapeXml(robotName)}"`, `build="${escapeXml(build)}"`, `xmlns:xi="http://www.w3.org/2001/XInclude"`];
    if (portPrefix) attrs.splice(1, 0, `portprefix="${escapeXml(portPrefix)}"`);
    const lines = [
      "<?xml version=\"1.0\" encoding=\"UTF-8\" ?>",
      "<!DOCTYPE robot PUBLIC \"-//YARP//DTD yarprobotinterface 3.0//EN\" \"http://www.yarp.it/DTD/yarprobotinterfaceV3.0.dtd\">",
      "",
      `<robot ${attrs.join(" ")}>`,
      "  <devices>"
    ];
    if (state.items.length) {
      for (const item of state.items) lines.push(segmentFor(item));
    }
    lines.push("  </devices>", "</robot>", "");
    return lines.join("\n");
  }

  function refreshPreview() {
    els.xmlPreview.value = buildXml();
    els.previewStatus.textContent = `${state.items.length} device${state.items.length === 1 ? "" : "s"} in document`;
  }

  function copyXml() {
    els.xmlPreview.focus();
    els.xmlPreview.select();
    const text = els.xmlPreview.value;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => {
        els.previewStatus.textContent = "Copied.";
      }).catch(() => document.execCommand("copy"));
    } else {
      document.execCommand("copy");
      els.previewStatus.textContent = "Copied.";
    }
  }

  function downloadXml() {
    const robotName = (els.robotName.value.trim() || "yarprobotinterface").replace(/[^A-Za-z0-9_.-]/g, "_");
    const blob = new Blob([els.xmlPreview.value], { type: "application/xml" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${robotName}.xml`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  function init() {
    refreshCatalogMeta();
    fillInterfaceSelect();
    renderExternalImports();
    renderDeviceList();
    refreshPreview();
    els.interfaceSelect.addEventListener("change", refreshDeviceSelect);
    els.deviceSelect.addEventListener("change", renderSelectedDevice);
    els.addDeviceButton.addEventListener("click", addDevice);
    els.resetFormButton.addEventListener("click", renderSelectedDevice);
    els.clearButton.addEventListener("click", () => {
      state.items = [];
      renderDeviceList();
      renderSelectedDevice();
      refreshPreview();
      setStatus("Cleared.");
    });
    for (const input of [els.robotName, els.portPrefix, els.buildValue]) {
      input.addEventListener("input", refreshPreview);
    }
    els.chooseYarpDataDirButton.addEventListener("click", chooseYarpDataDir);
    els.chooseManifestFilesButton.addEventListener("click", () => els.manifestFilesInput.click());
    els.yarpDataDirInput.addEventListener("change", async () => {
      try {
        await importFromFileList(els.yarpDataDirInput.files, true);
      } catch (err) {
        setExternalStatus(`Could not read manifests: ${err.message}`, "error");
      } finally {
        els.yarpDataDirInput.value = "";
      }
    });
    els.manifestFilesInput.addEventListener("change", async () => {
      try {
        await importFromFileList(els.manifestFilesInput.files, false);
      } catch (err) {
        setExternalStatus(`Could not read manifests: ${err.message}`, "error");
      } finally {
        els.manifestFilesInput.value = "";
      }
    });
    els.copyButton.addEventListener("click", copyXml);
    els.downloadButton.addEventListener("click", downloadXml);
  }

  init();
})();
</script>
</body>
</html>
